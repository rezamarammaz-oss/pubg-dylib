name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v3
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
      - name: Build
        run: |
          export THEOS=~/theos
          make package
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: dylib
          path: .theos/obj/*.dylib
